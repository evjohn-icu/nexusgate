name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}

      - name: cross-compile
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          ldflags="-s -w -X github.com/evjohn-icu/nexusgate/internal/buildinfo.Version=$version -X github.com/evjohn-icu/nexusgate/internal/domain.Version=$version"
          mkdir -p dist

          # Hub binary, one per platform the Hub itself runs on.
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o dist/nexusgate                ./cmd/nexusgate
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o dist/nexusgate-linux-arm64    ./cmd/nexusgate
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o dist/nexusgate-darwin-arm64   ./cmd/nexusgate

          # Worker binaries are the same nexusgate binary, named per
          # internal/api/worker_setup_page.go workerPlatforms. linux-amd64 is a
          # copy of the Hub binary; the other two are cross-compiled.
          cp dist/nexusgate dist/nexusgate-linux-amd64
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o dist/nexusgate-windows-amd64.exe ./cmd/nexusgate

          # MCP client for the two common dev platforms.
          GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="$ldflags" -o dist/nexusgate-mcp              ./cmd/nexusgate-mcp
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="$ldflags" -o dist/nexusgate-mcp-darwin-arm64 ./cmd/nexusgate-mcp

          ls -la dist

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
