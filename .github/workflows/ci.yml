name: CI

# The v0.14.1 admin-token retrofit gated Tag governance, pipeline runs and
# Repurpose writes but only updated one of the four browser pages, so three
# pages returned 401 on every write for several releases without anything
# failing. The whole suite runs in well under a minute — cheap insurance
# against that class of silent regression.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history is fetched (default checkout is shallow depth 1) so the
      # secret scan below actually sees every commit, not just the tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Full-history secret scan; fails the build on any leak. The CLI is
      # used rather than gitleaks-action because this repo is private and the
      # action requires a license (gitleaks itself is MIT). .gitleaks.toml
      # keeps every default rule and allowlists redaction-test fixtures.
      - name: secret scan (full history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks git --no-banner --redact --exit-code 1 .

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # The Worker install wizard hands out one cross-compiled .exe, and the
      # notification-area icon is Win32 code no test on this runner can execute.
      # Cross-compiling and vetting it is what keeps it from rotting unnoticed:
      # vet is what catches unsafe.Pointer misuse in the syscall layer.
      - name: build windows
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: vet windows
        run: GOOS=windows GOARCH=amd64 go vet ./...

      # ffmpeg/ffprobe are installed so internal/media's integration tests run
      # here instead of skipping themselves. Provider adapters are covered by
      # httptest fixtures, so nothing below reaches a real provider API.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The e2e suite (internal/e2e) needs ffmpeg on PATH and runs the real
      # SQLite + pipeline chain with scripted providers; -count=1 defeats the
      # test cache so every CI run exercises it. It also runs inside the
      # coverage gate and test -race steps below, but an explicit step makes
      # a regression in the harness itself visible before the whole-suite
      # numbers are computed.
      - name: e2e suite
        run: go test ./internal/e2e/ -count=1

      # Any doc that cites a Go source line must still point to the right
      # place; a reference silently drifting 175 lines is wrong docs.
      - name: check doc references
        run: bash scripts/check-doc-refs.sh

      - name: coverage gate
        run: |
          go test -coverprofile=coverage.out ./... > /tmp/cov-stdout.txt 2>&1
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/{print $NF}' | tr -d '()%')
          echo "Total statement coverage: ${COVERAGE}%"
          echo "Low-coverage packages (top 5):"
          grep 'coverage:' /tmp/cov-stdout.txt | \
            grep -oP 'github\.com/\S+.*?coverage:\s+\d+\.\d+%' | \
            awk '{pkg=$1; for(i=1;i<=NF;i++){if($i~/^[0-9.]+%$/){pct=$i+0; printf "%5.1f%%  %s\n", pct, pkg}}}' | \
            sort -t'%' -k1 -n | head -5
          THRESHOLD=65
          awk -v c="$COVERAGE" -v t="$THRESHOLD" \
            'BEGIN{if(c+0<t){print "FAIL: coverage",c"% is below required",t"%"; exit 1}else{print "PASS: coverage",c"% >=",t"%"}}'
          rm -f coverage.out /tmp/cov-stdout.txt

      - name: test -race
        run: go test -race -count=1 ./...
