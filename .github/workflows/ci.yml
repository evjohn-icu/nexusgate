name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GOFLAGS: -mod=readonly

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: secret scan (full history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.29.1
          gitleaks git --no-banner --redact --exit-code 1 .
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: build and vet windows
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: check doc references
        run: bash scripts/check-doc-refs.sh
      - name: check deployment versions
        run: bash scripts/check-deployment-versions.sh
      - name: check MCP tool count
        run: bash scripts/check-tool-count.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: unit tests (excluding e2e)
        run: go test -count=1 $(go list ./... | grep -v '/internal/e2e$')
      - name: coverage gate
        run: |
          packages=$(go list ./... | grep -v '/internal/e2e$')
          go test -coverprofile=coverage.out $packages > /tmp/cov-stdout.txt 2>&1
          go tool cover -func=coverage.out
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/{print $NF}' | tr -d '()%')
          echo "Total statement coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 65) { print "FAIL: coverage " c "% is below required 65%"; exit 1 } print "PASS: coverage " c "% >= 65%" }'
          rm -f coverage.out /tmp/cov-stdout.txt

  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -count=1 ./internal/repository/sqlite

  api-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: testdata/browser-smoke/package-lock.json
      - run: node --version
      - run: go test -count=1 ./internal/api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test ./internal/e2e -count=1

  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -count=1 ./internal/media

  search-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -count=1 ./internal/repository/sqlite -run 'TestRetrievalGolden|TestSearchV2Benchmark'
      - name: save search output
        if: always()
        run: go test ./internal/repository/sqlite -run 'TestRetrievalGolden|TestSearchV2Benchmark' -count=1 -v > search-quality.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: search-quality, path: search-quality.txt}

  search-relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - name: run deterministic offline relevance eval
        run: go test -count=1 -v ./internal/repository/sqlite -run '^TestSearchRelevanceEval$'

  race-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -race -count=1 ./internal/app ./internal/domain ./internal/media ./internal/search
  race-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -race -count=1 ./internal/repository/sqlite
  race-api-webdav:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -race -count=1 ./internal/api ./internal/webdavspace
  race-providers-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -race -count=1 ./internal/providers/... ./internal/providerpool ./internal/providerchannels ./internal/worker ./internal/remote

  race-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -race -count=1 ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test ./internal/search -run '^$' -fuzz=FuzzCompile -fuzztime=30s -parallel=1

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - run: go test -count=1 ./internal/app ./internal/media ./internal/providers/... ./internal/worker

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: testdata/browser-smoke/package-lock.json
      - name: install locked browser test dependencies
        working-directory: testdata/browser-smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: install Playwright Chromium
        working-directory: testdata/browser-smoke
        run: npx --no-install playwright install --with-deps chromium
      - name: fail fast if browser fixture does not compile
        run: bash scripts/check-browser-fixture.sh
      - name: start browser fixture
        run: |
          go build -tags playwrightfixture -o "$RUNNER_TEMP/nexusslate-playwright-fixture" ./cmd/nexusslate-playwright-fixture
          NEXUSSLATE_PLAYWRIGHT_ADDR=127.0.0.1:4173 \
            "$RUNNER_TEMP/nexusslate-playwright-fixture" > fixture.log 2>&1 &
          echo $! > fixture.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:4173/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat fixture.log
          exit 1
      - name: run browser smoke
        working-directory: testdata/browser-smoke
        run: npx --no-install playwright test
      - name: stop browser fixture
        if: always()
        run: |
          if test -s fixture.pid; then
            kill "$(cat fixture.pid)" 2>/dev/null || true
          fi
      # Playwright output is untrusted test data: do not put tokens or provider keys in it.
      - name: upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          retention-days: 3
          path: |
            testdata/browser-smoke/playwright-report/
            testdata/browser-smoke/test-results/
            fixture.log
