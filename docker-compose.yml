name: timingdex

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: timingdex:v0.22.0
    command: ["serve"]
    environment:
      TIMINGDEX_DATA_DIR: /var/lib/timingdex
      TIMINGDEX_LISTEN_ADDRESS: ${TIMINGDEX_LISTEN_ADDRESS:-0.0.0.0:8787}
      # Publishing a port puts Docker's NAT between the client and the Hub, and
      # the peer address the read guard sees becomes the bridge gateway -- an
      # RFC1918 address it trusts. Widening the binding below therefore hands
      # anonymous read access to anything that reaches the port unless this is
      # also set to a range no peer can match, which forces reads to carry a
      # token. Empty keeps the built-in loopback/LAN/CGNAT allowlist.
      TIMINGDEX_TRUSTED_READ_NETWORKS: ${TIMINGDEX_TRUSTED_READ_NETWORKS:-}
      # `auto` generates a self-signed Hub certificate in the data volume.
      # Use `files` with the two paths below for a managed certificate, or `off`
      # only behind an HTTPS reverse proxy.
      TIMINGDEX_TLS_MODE: ${TIMINGDEX_TLS_MODE:-auto}
      TIMINGDEX_TLS_CERT_FILE: ${TIMINGDEX_TLS_CERT_FILE:-}
      TIMINGDEX_TLS_KEY_FILE: ${TIMINGDEX_TLS_KEY_FILE:-}
      TIMINGDEX_PROVIDER_TIMEOUT: ${TIMINGDEX_PROVIDER_TIMEOUT:-}
      STEP_API_KEY: ${STEP_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_AGENT_PLAN_API_KEY: ${ARK_AGENT_PLAN_API_KEY:-}
      ARK_CODING_PLAN_API_KEY: ${ARK_CODING_PLAN_API_KEY:-}
    # Loopback only by default, so the browser UI works on the Docker host
    # without the NAT problem described above becoming an exposure. Override
    # TIMINGDEX_BIND to reach the Hub from the rest of the LAN.
    ports:
      - "${TIMINGDEX_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - timingdex-data:/var/lib/timingdex
      # The path must be the same path recorded by root add/scan. It is never
      # a writable destination for Timingdex artifacts. Required rather than
      # defaulted: a missing default would be created as an empty directory and
      # scan cleanly against nothing, which reads as a broken library rather
      # than as unset configuration.
      #
      # Point this at a parent directory -- e.g. /mnt/remotes on Unraid (where
      # Unassigned Devices mounts SMB/NFS shares) or /mnt on bare metal --
      # rather than one specific share. Combined with rslave propagation
      # below, a share mounted on the host *after* this container is already
      # running shows up inside the container live, with no
      # `docker compose up -d` needed to pick it up.
      - type: bind
        source: ${TIMINGDEX_MEDIA_ROOT:?set TIMINGDEX_MEDIA_ROOT to the footage directory to bind read-only}
        target: /media/library
        read_only: true
        bind:
          # Default bind propagation is rprivate: a share mounted on the host
          # under this path after the container started stays invisible to
          # it forever, and the only fix is recreating the container. rslave
          # propagates host-side mount/unmount events into the container
          # without the reverse -- the container still cannot create or
          # affect mounts on the host, so this does not weaken the read-only
          # bind above. Linux-only; Docker Desktop (macOS/Windows) doesn't
          # support bind propagation and silently ignores this rather than
          # erroring.
          propagation: rslave
      - type: bind
        source: ${TIMINGDEX_TLS_DIR:-./deploy/tls}
        target: /run/timingdex/tls
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # --- Optional GPU passthrough for the derive stage -----------------------
    # Uncomment one block below to hand the Hub a GPU, and add `target: gpu`
    # under `build:` above to use the GPU Dockerfile target -- the plain image
    # has no VAAPI userspace installed, so hardware acceleration silently
    # falls back to software either way without it.
    #
    # Intel / AMD, via VAAPI on the DRM render node (/dev/dri/renderD128):
    # the container runs as a fixed unprivileged uid (10001), so `devices:`
    # alone is not enough -- the render node is group-owned by a
    # host-specific GID (`render` on most distros, `video` on some), and
    # that GID differs per host, so it cannot be hardcoded here. Find it with:
    #   stat -c %g /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "104"   # replace with the GID printed by the stat command above
    #
    # NVIDIA, via the NVIDIA Container Toolkit: its default
    # NVIDIA_DRIVER_CAPABILITIES is `compute,utility`, which does NOT inject
    # libnvidia-encode.so.1 -- h264_nvenc still lists in `ffmpeg -encoders`
    # and then fails on the first frame, indistinguishable from no GPU at
    # all. `all` (or `compute,utility,video`) is required. Merge the
    # NVIDIA_DRIVER_CAPABILITIES line into the `environment:` block above
    # rather than adding a second `environment:` key here.
    #   environment:
    #     NVIDIA_DRIVER_CAPABILITIES: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  worker:
    image: timingdex:v0.22.0
    # Not started by `docker compose up`: worker.json only exists after
    # `worker enroll` has run against a live Hub, and without it the container
    # exits immediately and restarts forever. Enroll first, then
    # `docker compose --profile worker up -d worker`.
    profiles: ["worker"]
    command: ["worker", "run", "--config", "/var/lib/timingdex-worker/worker.json"]
    environment:
      # This is deliberately not the Hub data volume. A worker is an executor
      # and must not open, copy, or migrate the Hub SQLite database.
      TIMINGDEX_DATA_DIR: /var/lib/timingdex-worker
    volumes:
      - timingdex-worker-cache:/var/lib/timingdex-worker
      # See the matching comment on the hub service: point this at a parent
      # such as /mnt/remotes (Unraid) or /mnt (bare metal) so later-mounted
      # shares appear without recreating the container, and see rslave below
      # for why that only works with non-default bind propagation.
      - type: bind
        source: ${TIMINGDEX_MEDIA_ROOT:?set TIMINGDEX_MEDIA_ROOT to the footage directory to bind read-only}
        target: /media/library
        read_only: true
        bind:
          # rslave: a share mounted on the host after this container started
          # is otherwise invisible under the default rprivate propagation.
          # One-directional -- the container still cannot create mounts the
          # host would see. No-op (not an error) on Docker Desktop, which
          # doesn't support bind propagation.
          propagation: rslave
    tmpfs:
      - /run/timingdex:rw,noexec,nosuid,nodev
      - /tmp:rw,noexec,nosuid,nodev
    read_only: true
    restart: unless-stopped
    depends_on:
      - hub
    # --- Optional GPU passthrough for the derive stage -----------------------
    # A Worker only ever runs FFmpeg derive jobs, so this is where hardware
    # acceleration usually matters most. Uncomment one block below and add
    # `target: gpu` under `build:` above to use the GPU Dockerfile target --
    # see the matching comment on the `hub` service for why the CPU-only image
    # can't just be handed a device.
    #
    # Intel / AMD, via VAAPI on the DRM render node (/dev/dri/renderD128):
    # the container runs as a fixed unprivileged uid (10001), so `devices:`
    # alone is not enough -- the render node is group-owned by a
    # host-specific GID (`render` on most distros, `video` on some), and
    # that GID differs per host, so it cannot be hardcoded here. Find it with:
    #   stat -c %g /dev/dri/renderD128
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "104"   # replace with the GID printed by the stat command above
    #
    # NVIDIA, via the NVIDIA Container Toolkit: its default
    # NVIDIA_DRIVER_CAPABILITIES is `compute,utility`, which does NOT inject
    # libnvidia-encode.so.1 -- h264_nvenc still lists in `ffmpeg -encoders`
    # and then fails on the first frame, indistinguishable from no GPU at
    # all. `all` (or `compute,utility,video`) is required. Merge the
    # NVIDIA_DRIVER_CAPABILITIES line into the `environment:` block above
    # rather than adding a second `environment:` key here.
    #   environment:
    #     NVIDIA_DRIVER_CAPABILITIES: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  timingdex-data:
  timingdex-worker-cache:
